<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100e10"><link rel="manifest" href="manifest.json"><title>RELIC</title><style>
*{box-sizing:border-box}body{margin:0;background:#100e10;color:#f5f5f5;font:15px system-ui,sans-serif}main,header{max-width:1100px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between}h1{letter-spacing:2px;font-size:24px;margin:0;color:#c4a77d}small,p{color:#9999a5}button,input,select,textarea{font:inherit;border:1px solid #392e34;border-radius:9px;padding:12px;background:#292226;color:inherit}button{cursor:pointer}button.primary{background:#c4a77d;color:#100e10;border:0;font-weight:700}nav{position:fixed;bottom:0;left:0;right:0;background:#1d191c;border-top:1px solid #392e34;display:flex;justify-content:center;padding:8px 0 env(safe-area-inset-bottom);z-index:2}nav button{border:0;background:none;flex:1;max-width:180px;color:#9999a5}nav button.active{color:#c4a77d}main{padding-bottom:110px}.stats,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.stat,article{background:#1d191c;border:1px solid #392e34;border-radius:14px;padding:16px}.stat strong{display:block;font-size:25px;color:#c4a77d}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.toolbar input{flex:1;min-width:140px}.cards{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}article{padding:10px;overflow:hidden}article img,.placeholder{width:100%;aspect-ratio:3/4;object-fit:contain;background:#292226;border-radius:8px}.placeholder{display:grid;place-items:center;font-size:40px;color:#c4a77d}article h3{margin:10px 0 4px;overflow-wrap:anywhere}article button{padding:7px;font-size:12px}dialog{background:#1d191c;color:#f5f5f5;border:1px solid #44444d;border-radius:16px;width:min(94%,480px);max-height:90vh}dialog::backdrop{background:#000a}form{display:grid;gap:10px}label{display:grid;gap:4px;color:#c4a77d}input,select,textarea{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:40px 0;text-align:center;color:#9999a5}h2{font-weight:500} </style><style>body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}h1{font-size:26px;font-weight:800;letter-spacing:.5px;color:#f5f5f5}h1 span{color:#c4a77d}header{padding-top:calc(20px + env(safe-area-inset-top,0px))}nav{padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:4px}nav button{min-height:48px;border-radius:10px;font-size:12px}nav button.active{background:#c4a77d;color:#100e10}button:focus-visible,input:focus-visible{outline:2px solid #c4a77d;outline-offset:2px}</style></head><body><header><div><h1>RELIC<span>.</span></h1><small>Collect. Organize. Preserve.</small></div><button class="primary" id="add">+ Add</button></header><main id="main"></main><nav id="nav"></nav><dialog id="editor"><form id="form"><h2 id="heading">Add collectible</h2><label>Category<select name="category"><option>Comics</option><option>LEGO</option><option>Hot Wheels</option><option>Other</option></select></label><label>Title<input name="title" required></label><label>Series / collection<input name="series"></label><label>Issue / set / model number<input name="number"></label><label>Publisher / brand<input name="brand"></label><label>Status<select name="status"><option>Owned</option><option>Missing</option><option>Wishlist</option></select></label><label>Condition<select name="condition"><option>Unknown</option><option>Mint</option><option>Good</option><option>Fair</option><option>Poor</option></select></label><label>Purchase price (HUF)<input name="price" type="number" min="0"></label><label>Estimated value (HUF)<input name="value" type="number" min="0"></label><label>Cover / photo<input id="photo" type="file" accept="image/*"></label><label>Notes<textarea name="notes"></textarea></label><div class="actions"><button class="primary" type="submit">Save</button><button type="button" id="cancel">Cancel</button></div></form></dialog><input type="file" id="restore" accept="application/json" hidden><script>
const $=s=>document.querySelector(s), key='relic-v1';let items=[];try{items=JSON.parse(localStorage.getItem(key)||'[]')}catch{}let page='Home',category='All',query='',editing=null,photo='';const categories=['All','Comics','LEGO','Hot Wheels','Other'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('hu-HU')+' Ft';function save(next){try{localStorage.setItem(key,JSON.stringify(next));items=next;return true}catch{alert('Storage full or unavailable. Export a backup and try a smaller image.');return false}}function render(){let owned=items.filter(x=>x.status==='Owned');$('#nav').innerHTML=['Home','Collection','Wishlist','Settings'].map(p=>`<button class="${page===p?'active':''}" data-page="${p}">${p}</button>`).join('');if(page==='Settings'){$('#main').innerHTML='<h2>Settings</h2><p>RELIC v1.0.2 · Local storage · HUF</p><div class="actions"><button id="export">Export backup</button><button id="import">Restore backup</button></div><p>Backups include your photos. Restoring replaces the current collection.</p>';$('#export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(items)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='relic-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('#import').onclick=()=>$('#restore').click();return}let list=items.filter(x=>(page!=='Wishlist'||x.status==='Wishlist'||x.status==='Missing')&&(category==='All'||x.category===category)&&[x.title,x.series,x.number,x.brand].join(' ').toLowerCase().includes(query.toLowerCase()));$('#main').innerHTML=(page==='Home'?`<h2>Your collection</h2><div class="stats">${[['Owned',owned.length],['Missing',items.filter(x=>x.status==='Missing').length],['Spent',money(owned.reduce((a,x)=>a+Number(x.price||0),0))],['Estimated value',money(owned.reduce((a,x)=>a+Number(x.value||0),0))]].map(([k,v])=>`<div class="stat"><small>${k}</small><strong>${v}</strong></div>`).join('')}</div><p>Completion: ${items.filter(x=>x.status!=='Wishlist').length?Math.round(100*owned.length/items.filter(x=>x.status!=='Wishlist').length):0}% of catalogued non-wishlist items</p>`:`<h2>${page}</h2>`)+`<div class="toolbar"><input id="search" placeholder="Search collectibles" value="${esc(query)}"><select id="filter" style="width:auto">${categories.map(c=>`<option ${c===category?'selected':''}>${c}</option>`).join('')}</select></div><div class="cards">${list.map(x=>`<article>${/^data:image\/(png|jpeg|webp);base64,/.test(x.photo||'')?`<img src="${esc(x.photo)}" alt="Cover">`:'<div class="placeholder">◇</div>'}<small>${esc(x.category)} · ${esc(x.status)}</small><h3>${esc(x.title)}</h3><p>${esc(x.series)} ${esc(x.number)}</p><div class="actions"><button data-edit="${esc(x.id)}">Edit</button><button data-delete="${esc(x.id)}">Delete</button></div></article>`).join('')}</div>${list.length?'':'<div class="empty">No collectibles here yet. Add your first item.</div>'}`;$('#search').oninput=e=>{query=e.target.value;let pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#filter').onchange=e=>{category=e.target.value;render()}}function openItem(x){editing=x?.id||null;photo=x?.photo||'';$('#form').reset();$('#heading').textContent=x?'Edit collectible':'Add collectible';if(x)for(let e of $('#form').elements)if(e.name&&x[e.name]!=null)e.value=x[e.name];$('#editor').showModal()}$('#add').onclick=()=>openItem();$('#cancel').onclick=()=>$('#editor').close();$('#photo').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let b=await createImageBitmap(f),c=document.createElement('canvas'),s=Math.min(1,700/Math.max(b.width,b.height));c.width=Math.max(1,b.width*s);c.height=Math.max(1,b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.75)}catch{alert('Could not read image')}};$('#form').onsubmit=e=>{e.preventDefault();let x={...Object.fromEntries(new FormData(e.target)),id:editing||crypto.randomUUID(),photo};if(save(editing?items.map(y=>y.id===editing?x:y):[...items,x])){$('#editor').close();render()}};document.addEventListener('click',e=>{let d=e.target.dataset;if(d.page){page=d.page;category='All';query='';render()}if(d.edit)openItem(items.find(x=>x.id===d.edit));if(d.delete&&confirm('Delete this collectible?')){save(items.filter(x=>x.id!==d.delete));render()}});$('#restore').onchange=async e=>{try{let a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a)||!a.every(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&categories.includes(x.category)&&['Owned','Missing','Wishlist'].includes(x.status))||new Set(a.map(x=>x.id)).size!==a.length)throw Error();if(confirm('Replace current collection?')){save(a);render()}}catch{alert('Invalid backup')}e.target.value=''};render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.error);
</script></body></html>
